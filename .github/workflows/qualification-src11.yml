name: SRC-11 sealed evidence

on:
  pull_request:
    branches: [v2]
    paths:
      - '.github/workflows/qualification-src11.yml'
      - '.gitattributes'
      - 'bin/qualification/**'
      - 'apps/manager-server/tests/qualification/src11/**'
      - 'tests/fixtures/phase4a-src11/**'
      - 'tests/fixtures/phase4a-evidence/src-11/**'
      - 'tests/fixtures/phase4a-evidence/ret-01/**'
      - 'tests/fixtures/phase4a-evidence/ret-02/**'
      - 'tests/fixtures/phase4a-evidence/ret-03/**'
      - 'tests/fixtures/phase4a-evidence/ret-07/**'
      - 'tests/fixtures/phase4a-evidence/mig-01/**'
      - 'tests/fixtures/phase4a-evidence/mig-02/**'

permissions:
  contents: read

concurrency:
  group: src11-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  replay:
    name: SRC-11 packaging (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/manager-server/go.mod
          cache-dependency-path: apps/manager-server/go.sum
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Download immutable qualification artifact (outside Go test)
        shell: bash
        run: |
          gh release download qualification-src11-0e106589baef-20261014 \
            --repo seakee/CPA-Manager-Plus \
            --pattern src-11-0e106589baef-sealed-evidence.tar.gz --dir "$RUNNER_TEMP/src11-download"
      - name: Download original RET-01 case bytes for strict cross-platform verification
        shell: bash
        run: |
          gh release download qualification-ret01-82e2287ed64e-20261014 \
            --repo seakee/CPA-Manager-Plus \
            --pattern ret-01-82e2287ed64e-sealed-evidence.zip --dir "$RUNNER_TEMP/ret01-download"
          gh api repos/seakee/CPA-Manager-Plus/releases/412621764 > "$RUNNER_TEMP/ret01-release.json"
          python bin/qualification/materialize-src11.py --case ret-01 \
            --release-metadata "$RUNNER_TEMP/ret01-release.json" \
            --archive "$RUNNER_TEMP/ret01-download/ret-01-82e2287ed64e-sealed-evidence.zip" \
            --output "$RUNNER_TEMP/ret01-original"
      - name: Download and materialize immutable RET-02 bytes
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          pin = json.loads(Path('tests/fixtures/phase4a-evidence/ret-02/source-provenance.json').read_text())['sourceArtifact']
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              for key, field in [('RET02_TAG', 'tag'), ('RET02_ASSET', 'archiveName'), ('RET02_RELEASE_ID', 'releaseID')]:
                  stream.write(f'{key}={pin[field]}\n')
          PY
          # Values are consumed in the next step after GITHUB_ENV is loaded.
      - name: Verify RET-02 hosting identity and bytes
        shell: bash
        run: |
          gh release download "$RET02_TAG" --repo seakee/CPA-Manager-Plus \
            --pattern "$RET02_ASSET" --dir "$RUNNER_TEMP/ret02-download"
          gh api "repos/seakee/CPA-Manager-Plus/releases/$RET02_RELEASE_ID" > "$RUNNER_TEMP/ret02-release.json"
          python bin/qualification/materialize-src11.py --case ret-02 \
            --release-metadata "$RUNNER_TEMP/ret02-release.json" \
            --archive "$RUNNER_TEMP/ret02-download/$RET02_ASSET" --output "$RUNNER_TEMP/ret02-original"
      - name: Verify materialization and reject adversarial archives
        shell: bash
        run: |
          export CPAMP_RET01_FULL_EVIDENCE="$RUNNER_TEMP/ret01-original"
          export CPAMP_RET01_SEALED_ARCHIVE="$RUNNER_TEMP/ret01-download/ret-01-82e2287ed64e-sealed-evidence.zip"
          export CPAMP_SRC11_SEALED_ARCHIVE="$RUNNER_TEMP/src11-download/src-11-0e106589baef-sealed-evidence.tar.gz"
          export CPAMP_RET02_SEALED_ARCHIVE="$RUNNER_TEMP/ret02-download/$RET02_ASSET"
          export CPAMP_RET02_FULL_EVIDENCE="$RUNNER_TEMP/ret02-original"
          python -m unittest discover -s bin/qualification -p 'test_*.py' -v
          python bin/qualification/materialize-src11.py --archive "$CPAMP_SRC11_SEALED_ARCHIVE" --output "$RUNNER_TEMP/src11-original"
          python - <<'PY'
          import hashlib, json, os, platform, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          archive = root / 'src11-download/src-11-0e106589baef-sealed-evidence.tar.gz'
          record = {'scope': 'archive materialization only; not SQLite/migration qualification',
                    'runtimeAssertions': 'pass', 'independentAcceptance': 'pending',
                    'archiveSHA256': hashlib.sha256(archive.read_bytes()).hexdigest(),
                    'testedCommit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                    'platform': platform.platform(), 'pythonVersion': platform.python_version()}
          (root / 'src11-materialization.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - name: Replay original sealed fixture (offline test)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          extra=()
          if [ "$RUNNER_OS" = Linux ]; then
            docker pull --platform linux/amd64 debian@sha256:f3034a6ec3c1205360777c4aae76234998866ad18806ae62b63a3f84ccad782b
            extra=(--linux)
          fi
          python bin/qualification/run-src11.py replay \
            --archive "$RUNNER_TEMP/src11-original/producer/cpa-manager-plus_v1.14.4_linux_amd64.tar.gz" \
            --evidence-archive "$RUNNER_TEMP/src11-download/src-11-0e106589baef-sealed-evidence.tar.gz" \
            --output "$RUNNER_TEMP/src11-replay" "${extra[@]}"
      - name: Compile Windows harness (full SQLite replay remains pending)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: apps/manager-server
        run: |
          go test -c -o "$RUNNER_TEMP/src11-windows-qualification.exe" ./tests/qualification/src11 > "$RUNNER_TEMP/src11-windows-compile.txt" 2>&1
          echo 'Windows archive materialization ran successfully. Full Windows bundle replay remains pending: the observed matching-evidence quick_check failure is preserved in the PR evidence; no SQLite qualification PASS is claimed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload actual runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: src11-packaging-replay-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/src11-replay/runner-evidence.json
            ${{ runner.temp }}/src11-replay/*.log
            ${{ runner.temp }}/src11-replay/runtime/
            ${{ runner.temp }}/src11-materialization.json
            ${{ runner.temp }}/src11-windows-compile.txt
          if-no-files-found: warn
          retention-days: 14

  ret01:
    name: ${{ matrix.case }} exact-source replay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        case: [ret-01, ret-02]
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/manager-server/go.mod
          cache-dependency-path: apps/manager-server/go.sum
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Read the case's immutable evidence pins
        shell: bash
        env:
          RETENTION_CASE: ${{ matrix.case }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          case = os.environ['RETENTION_CASE']
          pin = json.loads(Path(f'tests/fixtures/phase4a-evidence/{case}/source-provenance.json').read_text())['sourceArtifact']
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              for key, field in [('RETENTION_TAG', 'tag'), ('RETENTION_ASSET', 'archiveName'), ('RETENTION_RELEASE_ID', 'releaseID')]:
                  stream.write(f'{key}={pin[field]}\n')
          PY
      - name: Download and authenticate original immutable retention fixture
        shell: bash
        run: |
          gh release download "$RETENTION_TAG" \
            --repo seakee/CPA-Manager-Plus \
            --pattern "$RETENTION_ASSET" --dir "$RUNNER_TEMP/ret01-download"
          gh api "repos/seakee/CPA-Manager-Plus/releases/$RETENTION_RELEASE_ID" > "$RUNNER_TEMP/ret01-release.json"
          python bin/qualification/materialize-src11.py --case "${{ matrix.case }}" \
            --release-metadata "$RUNNER_TEMP/ret01-release.json" \
            --archive "$RUNNER_TEMP/ret01-download/$RETENTION_ASSET" \
            --output "$RUNNER_TEMP/ret01-source"
      - name: Verify committed retention evidence contract
        env:
          CPAMP_RET01_FULL_EVIDENCE: ${{ runner.temp }}/ret01-source
          CPAMP_RET02_FULL_EVIDENCE: ${{ runner.temp }}/ret01-source
        run: python -m unittest discover -s bin/qualification -p 'test_${{ matrix.case == 'ret-01' && 'ret01' || 'ret02' }}.py' -v
      - name: Replay retention against v2 primitives
        shell: bash
        run: |
          extra=()
          if [ "$RUNNER_OS" = Linux ]; then
            docker pull --platform linux/amd64 debian@sha256:f3034a6ec3c1205360777c4aae76234998866ad18806ae62b63a3f84ccad782b
            extra=(--linux)
          fi
          python bin/qualification/run-src11.py "${{ matrix.case == 'ret-01' && 'ret01' || 'ret02' }}" \
            --archive "$RUNNER_TEMP/ret01-source/producer.tar.gz" \
            --evidence "$RUNNER_TEMP/ret01-source/${{ matrix.case }}" \
            --output "$RUNNER_TEMP/ret01-replay" "${extra[@]}"
      - name: Upload case-specific retention runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.case }}-replay-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ret01-replay/runner-evidence.json
            ${{ runner.temp }}/ret01-replay/*.log
            ${{ runner.temp }}/ret01-replay/runtime/
          if-no-files-found: warn
          retention-days: 90

  ret03:
    name: RET-03 exact-source replay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      CPAMP_RET03_REQUIRED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/manager-server/go.mod
          cache-dependency-path: apps/manager-server/go.sum
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Read RET-03 immutable evidence pins
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          pin = json.loads(Path('tests/fixtures/phase4a-evidence/ret-03/source-provenance.json').read_text())['sourceArtifact']
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              for key, field in [('RET03_TAG', 'tag'), ('RET03_ASSET', 'archiveName'), ('RET03_RELEASE_ID', 'releaseID')]:
                  stream.write(f'{key}={pin[field]}\n')
          PY
      - name: Download and materialize RET-03 original immutable bytes
        shell: bash
        run: |
          gh release download "$RET03_TAG" --repo seakee/CPA-Manager-Plus \
            --pattern "$RET03_ASSET" --dir "$RUNNER_TEMP/ret03-download"
          gh api "repos/seakee/CPA-Manager-Plus/releases/$RET03_RELEASE_ID" > "$RUNNER_TEMP/ret03-release.json"
          gh api "repos/seakee/CPA-Manager-Plus/git/ref/tags/$RET03_TAG" > "$RUNNER_TEMP/ret03-tag.json"
          python bin/qualification/materialize-src11.py --case ret-03 \
            --release-metadata "$RUNNER_TEMP/ret03-release.json" \
            --tag-metadata "$RUNNER_TEMP/ret03-tag.json" \
            --archive "$RUNNER_TEMP/ret03-download/$RET03_ASSET" \
            --output "$RUNNER_TEMP/ret03-original"
      - name: Verify RET-03 committed evidence contract
        env:
          CPAMP_RET03_FULL_EVIDENCE: ${{ runner.temp }}/ret03-original
        run: python -m unittest discover -s bin/qualification -p 'test_ret03.py' -v
      - name: Replay RET-03 against v2 primitives
        shell: bash
        run: |
          extra=()
          if [ "$RUNNER_OS" = Linux ]; then
            docker pull --platform linux/amd64 debian@sha256:f3034a6ec3c1205360777c4aae76234998866ad18806ae62b63a3f84ccad782b
            extra=(--linux)
          fi
          python bin/qualification/run-src11.py ret03 \
            --archive "$RUNNER_TEMP/ret03-original/producer.tar.gz" \
            --evidence "$RUNNER_TEMP/ret03-original/ret-03" \
            --output "$RUNNER_TEMP/ret03-replay" "${extra[@]}"
      - name: Upload RET-03 runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ret-03-replay-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ret03-replay/runner-evidence.json
            ${{ runner.temp }}/ret03-replay/*.log
            ${{ runner.temp }}/ret03-replay/runtime/
          if-no-files-found: warn
          retention-days: 90

  ret07-generate:
    name: RET-07 isolated source generation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/manager-server/go.mod
          cache-dependency-path: apps/manager-server/go.sum
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Download exact v1.14.4 producer asset
        shell: bash
        run: |
          gh release download v1.14.4 --repo seakee/CPA-Manager-Plus \
            --pattern cpa-manager-plus_v1.14.4_linux_amd64.tar.gz \
            --dir "$RUNNER_TEMP/ret07-producer"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path(__import__('os').environ['RUNNER_TEMP'])
          archive = root / 'ret07-producer/cpa-manager-plus_v1.14.4_linux_amd64.tar.gz'
          pin = json.loads(Path('tests/fixtures/phase4a-evidence/ret-07/source-provenance.json').read_text())['producerArtifact']
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual != pin['archiveSHA256']:
              raise SystemExit(f'v1.14.4 producer archive digest mismatch: {actual} != {pin["archiveSHA256"]}')
          PY
      - name: Prepare pinned Linux isolation image
        run: docker pull --platform linux/amd64 debian@sha256:f3034a6ec3c1205360777c4aae76234998866ad18806ae62b63a3f84ccad782b
      - name: Generate RET-07 source bundle through production lifecycle
        shell: bash
        run: |
          python bin/qualification/run-src11.py generate-ret07 \
            --archive "$RUNNER_TEMP/ret07-producer/cpa-manager-plus_v1.14.4_linux_amd64.tar.gz" \
            --release-info tests/fixtures/phase4a-evidence/ret-07/source-generation/release-info.json \
            --output "$RUNNER_TEMP/ret07-generation"
          tar -czf "$RUNNER_TEMP/ret07-generation.tar.gz" \
            -C "$RUNNER_TEMP/ret07-generation" ret-07
      - name: Upload isolated RET-07 source bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ret-07-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ret07-generation.tar.gz
            ${{ runner.temp }}/ret07-generation/*.log
          if-no-files-found: warn
          retention-days: 14

  ret07:
    name: RET-07 retained pricing replay (${{ matrix.os }})
    needs: ret07-generate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/manager-server/go.mod
          cache-dependency-path: apps/manager-server/go.sum
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Verify committed RET-07 evidence contract
        run: python bin/qualification/verify-ret07-evidence.py
      - name: Download exact v1.14.4 producer asset
        shell: bash
        run: |
          gh release download v1.14.4 --repo seakee/CPA-Manager-Plus \
            --pattern cpa-manager-plus_v1.14.4_linux_amd64.tar.gz \
            --dir "$RUNNER_TEMP/ret07-producer"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path(__import__('os').environ['RUNNER_TEMP'])
          archive = root / 'ret07-producer/cpa-manager-plus_v1.14.4_linux_amd64.tar.gz'
          pin = json.loads(Path('tests/fixtures/phase4a-evidence/ret-07/source-provenance.json').read_text())['producerArtifact']
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual != pin['archiveSHA256']:
              raise SystemExit(f'v1.14.4 producer archive digest mismatch: {actual} != {pin["archiveSHA256"]}')
          PY
      - name: Download generated RET-07 source bundle
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ret-07-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ret07-generated
      - name: Extract generated RET-07 source bundle
        shell: bash
        run: tar -xzf "$RUNNER_TEMP/ret07-generated/ret07-generation.tar.gz" -C "$RUNNER_TEMP/ret07-generated"
      - name: Replay RET-07 on the generated raw-deleted state
        shell: bash
        run: |
          extra=()
          if [ "$RUNNER_OS" = Linux ]; then
            docker pull --platform linux/amd64 debian@sha256:f3034a6ec3c1205360777c4aae76234998866ad18806ae62b63a3f84ccad782b
            extra=(--linux)
          fi
          python bin/qualification/run-src11.py ret07 \
            --archive "$RUNNER_TEMP/ret07-producer/cpa-manager-plus_v1.14.4_linux_amd64.tar.gz" \
            --evidence "$RUNNER_TEMP/ret07-generated/ret-07" \
            --output "$RUNNER_TEMP/ret07-replay" "${extra[@]}"
      - name: Replay RET-07 from a clean detached checkout
        shell: bash
        run: |
          clean="$RUNNER_TEMP/ret07-clean-checkout"
          git clone --no-local --quiet "$GITHUB_WORKSPACE" "$clean"
          git -C "$clean" checkout --quiet --detach "$GITHUB_SHA"
          test -z "$(git -C "$clean" status --porcelain --untracked-files=all)"
          extra=()
          if [ "$RUNNER_OS" = Linux ]; then
            extra=(--linux)
          fi
          python "$clean/bin/qualification/run-src11.py" ret07 \
            --archive "$RUNNER_TEMP/ret07-producer/cpa-manager-plus_v1.14.4_linux_amd64.tar.gz" \
            --evidence "$RUNNER_TEMP/ret07-generated/ret-07" \
            --output "$RUNNER_TEMP/ret07-clean-replay" "${extra[@]}"
      - name: Assert RET-07 runtime and pricing reconciliation are not skipped
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          result = json.loads((root / 'ret07-replay/runtime/result.json').read_text())
          pricing = json.loads((root / 'ret07-generated/ret-07/source-generation/retained-pricing-source.json').read_text())
          sem = json.loads((root / 'ret07-replay/runtime/semantic-assertions.json').read_text())
          if result.get('runtimeEvidence') != 'pass' or result.get('casePass') is not False:
              raise SystemExit(f'RET-07 runtime/authority boundary invalid: {result}')
          if result.get('retainedPricingSourceComplete') is not True or result.get('onlineRawComplete') is not False:
              raise SystemExit('RET-07 retained/raw completeness boundary invalid')
          if pricing.get('missingPricingEvents') != [] or pricing.get('duplicateEventIDs') != [] or pricing.get('retainedPricingSourceComplete') is not True:
              raise SystemExit('RET-07 pricing reconciliation was incomplete')
          if pricing.get('explicitZeroEvents') != [3] or pricing.get('unknownUnpricedEvents') != [4]:
              raise SystemExit('RET-07 explicit-zero/unknown distinction was not executed')
          for sem_id in ('SEM-01', 'SEM-02', 'SEM-03', 'SEM-04', 'SEM-05', 'SEM-09'):
              if sem.get('assertions', {}).get(sem_id, {}).get('status') != 'runtime-pass':
                  raise SystemExit(f'RET-07 {sem_id} was skipped or did not pass')
          PY
      - name: Upload RET-07 runtime observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ret-07-replay-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ret07-replay/runner-evidence.json
            ${{ runner.temp }}/ret07-replay/*.log
            ${{ runner.temp }}/ret07-replay/runtime/
            ${{ runner.temp }}/ret07-clean-replay/runner-evidence.json
            ${{ runner.temp }}/ret07-clean-replay/*.log
            ${{ runner.temp }}/ret07-clean-replay/runtime/
          if-no-files-found: warn
          retention-days: 90

  mig01:
    name: MIG-01 completed migrations (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      CPAMP_MIG01_REQUIRED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/manager-server/go.mod
          cache-dependency-path: apps/manager-server/go.sum
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Download and materialize original immutable MIG-01 bytes
        shell: bash
        run: |
          pin=tests/fixtures/phase4a-evidence/mig-01/source-provenance.json
          tag=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["sourceArtifact"]["tag"])' "$pin")
          asset=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["sourceArtifact"]["archiveName"])' "$pin")
          release_id=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["sourceArtifact"]["releaseID"])' "$pin")
          gh release download "$tag" --repo seakee/CPA-Manager-Plus --pattern "$asset" --dir "$RUNNER_TEMP/mig01-download"
          gh api "repos/seakee/CPA-Manager-Plus/releases/$release_id" > "$RUNNER_TEMP/mig01-release.json"
          gh api "repos/seakee/CPA-Manager-Plus/git/ref/tags/$tag" > "$RUNNER_TEMP/mig01-tag.json"
          python bin/qualification/materialize-src11.py --case mig-01 \
            --release-metadata "$RUNNER_TEMP/mig01-release.json" \
            --tag-metadata "$RUNNER_TEMP/mig01-tag.json" \
            --archive "$RUNNER_TEMP/mig01-download/$asset" --output "$RUNNER_TEMP/mig01-original"
      - name: Verify MIG-01 committed evidence and actual persisted source
        shell: bash
        run: |
          export CPAMP_MIG01_FULL_EVIDENCE="$RUNNER_TEMP/mig01-original/mig-01"
          python -m unittest discover -s bin/qualification -p test_mig01.py -v
      - name: Execute MIG-01 read-only qualification
        if: runner.os != 'Windows'
        shell: bash
        run: |
          extra=()
          if [ "$RUNNER_OS" = Linux ]; then
            docker pull --platform linux/amd64 debian@sha256:f3034a6ec3c1205360777c4aae76234998866ad18806ae62b63a3f84ccad782b
            extra=(--linux)
          fi
          python bin/qualification/run-src11.py mig01 \
            --archive "$RUNNER_TEMP/mig01-original/producer.tar.gz" \
            --evidence "$RUNNER_TEMP/mig01-original/mig-01" \
            --output "$RUNNER_TEMP/mig01-replay" "${extra[@]}"
      - name: Compile Windows qualification harness
        if: runner.os == 'Windows'
        shell: bash
        working-directory: apps/manager-server
        run: go test -mod=readonly -c -o "$RUNNER_TEMP/mig01-qualification.exe" ./tests/qualification/src11
      - name: Upload MIG-01 runtime observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mig01-replay-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mig01-replay/runner-evidence.json
            ${{ runner.temp }}/mig01-replay/*.log
            ${{ runner.temp }}/mig01-replay/runtime/
            ${{ runner.temp }}/mig01-release.json
          if-no-files-found: warn
          retention-days: 90

  mig02:
    name: MIG-02 applying recovery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
