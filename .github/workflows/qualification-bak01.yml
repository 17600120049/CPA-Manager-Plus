name: BAK-01 committed WAL

on:
  pull_request:
    branches: [v2]
    paths:
      - '.github/workflows/qualification-bak01.yml'
      - '.gitattributes'
      - 'bin/qualification/**'
      - 'apps/manager-server/tests/qualification/src11/**'
      - 'tests/fixtures/phase4a-evidence/bak-01/**'

permissions:
  contents: read

concurrency:
  group: bak01-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  replay:
    name: BAK-01 replay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31d06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/manager-server/go.mod
          cache-dependency-path: apps/manager-server/go.sum
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Authenticate committed sealed BAK-01 archive
        shell: bash
        run: |
          python - <<'PY'
          import json
          import hashlib
          import os
          from pathlib import Path
          provenance = json.loads(Path('tests/fixtures/phase4a-evidence/bak-01/source-provenance.json').read_text())
          pin = provenance['sourceArtifact']
          archive = Path('tests/fixtures/phase4a-evidence/bak-01') / pin['committedArchivePath']
          data = archive.read_bytes()
          if len(data) != pin['archiveSize'] or hashlib.sha256(data).hexdigest() != pin['archiveSHA256']:
              raise SystemExit('committed BAK-01 sealed archive size/SHA256 mismatch')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f"BAK01_ARCHIVE={archive.resolve()}\n")
          PY
      - name: Download and authenticate exact v1.14.4 producer
        shell: bash
        run: |
          gh release download v1.14.4 --repo seakee/CPA-Manager-Plus \
            --pattern cpa-manager-plus_v1.14.4_linux_amd64.tar.gz \
            --dir "$RUNNER_TEMP/producer-download"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          pin = json.loads(Path('tests/fixtures/phase4a-evidence/bak-01/source-provenance.json').read_text())
          archive = Path(os.environ['RUNNER_TEMP']) / 'producer-download/cpa-manager-plus_v1.14.4_linux_amd64.tar.gz'
          if hashlib.sha256(archive.read_bytes()).hexdigest() != pin['sourceProducerArchiveSHA256']:
              raise SystemExit('v1.14.4 producer archive pin mismatch')
          PY
      - name: Verify committed BAK-01 evidence contract
        shell: bash
        run: python -m unittest bin.qualification.test_bak01 -v
      - name: Replay BAK-01 in the pinned Linux AMD64 runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker pull --platform linux/amd64 debian@sha256:f3034a6ec3c1205360777c4aae76234998866ad18806ae62b63a3f84ccad782b
          python bin/qualification/run-src11.py bak01 \
            --archive "$RUNNER_TEMP/producer-download/cpa-manager-plus_v1.14.4_linux_amd64.tar.gz" \
            --evidence-archive "$BAK01_ARCHIVE" \
            --linux --output "$RUNNER_TEMP/bak01-replay"
      - name: Replay BAK-01 on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python bin/qualification/run-src11.py bak01 \
            --archive "$RUNNER_TEMP/producer-download/cpa-manager-plus_v1.14.4_linux_amd64.tar.gz" \
            --evidence-archive "$BAK01_ARCHIVE" \
            --output "$RUNNER_TEMP/bak01-replay"
      - name: Compile Windows harness (SQLite replay not qualified)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: apps/manager-server
        run: |
          go test -mod=readonly -c -o "$RUNNER_TEMP/bak01-qualification.exe" ./tests/qualification/src11
          echo 'Windows BAK-01 scope: immutable archive materialization and harness compilation completed; full SQLite replay is pending and no Windows case PASS is claimed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload BAK-01 runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bak01-replay-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bak01-replay/runner-evidence.json
            ${{ runner.temp }}/bak01-replay/*.log
            ${{ runner.temp }}/bak01-replay/runtime/
            ${{ runner.temp }}/bak01-qualification.exe
          if-no-files-found: warn
          retention-days: 90
