# Private PAH-S0 Linux/amd64 Fresh New security proof only; NOT a release profile.
# Ingress and the trusted Manager share Runtime's network namespace.
# Only Ingress binds a non-loopback listener; CPA, Manager and control stay loopback-only.
# The only published endpoint is a host-loopback Ingress port.
# Explicit `docker compose restart cpamp-runtime` must restart both namespace
# consumers as well; container-engine/direct Docker restarts are NOT covered.
services:
  cpamp-runtime:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.runtime
      target: v8-amd64-loopback-proof
    image: cpamp-runtime:pah-s0-proof
    restart: 'no'
    ports:
      - '127.0.0.1:${CPAMP_PAH_S0_PUBLIC_PORT:-28491}:${CPAMP_PAH_S0_PUBLIC_PORT:-28491}'
    environment:
      CPAMP_RUNTIME_ADDR: '127.0.0.1:9081'
      CPAMP_RUNTIME_IDENTITY: 'embedded-auth-proof'
      CPAMP_RUNTIME_JOURNAL_PATH: '/runtime/supervisor/operations.sqlite'
      CPAMP_RUNTIME_CPA_ADDR: '127.0.0.1:8317'
      CPAMP_RUNTIME_CPA_UID: '10001'
      CPAMP_RUNTIME_CPA_GID: '10001'
      CPAMP_CPA_EXECUTABLE: '/usr/local/bin/cli-proxy-api'
      CPAMP_RUNTIME_TOKEN_FILE: '/run/cpamp/runtime-secret/token'
    volumes:
      - cpamp-pah-s0-runtime-data:/runtime
      - cpamp-pah-s0-runtime-secret:/run/cpamp/runtime-secret

  cpamp-manager:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.manager-server
      args:
        VITE_CPAMP_PAH_S0: '1'
    image: cpamp-manager:pah-s0-proof
    restart: 'no'
    network_mode: 'service:cpamp-runtime'
    # Manager must verify the actual ingress loopback origin before route commit.
    environment:
      HTTP_ADDR: '127.0.0.1:18319'
      CPAMP_PRIVATE_PAH_S0: '1'
      USAGE_DB_PATH: '/data/usage.sqlite'
      CPA_MANAGER_DATA_KEY_PATH: '/data/data.key'
      CPA_UPSTREAM_URL: 'http://127.0.0.1:8317'
      CPAMP_RUNTIME_URL: 'http://127.0.0.1:9081'
      CPAMP_RUNTIME_TOKEN_FILE: '/run/cpamp/runtime-secret/token'
      CPAMP_INGRESS_CONTROL_URL: 'http://127.0.0.1:9082'
      CPAMP_PUBLIC_ORIGIN: 'http://127.0.0.1:${CPAMP_PAH_S0_PUBLIC_PORT:-28491}'
    volumes:
      - cpamp-pah-s0-manager-data:/data
      - cpamp-pah-s0-runtime-secret:/run/cpamp/runtime-secret:ro
    depends_on:
      cpamp-runtime:
        condition: service_started
        restart: true

  cpamp-ingress:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.ingress
    image: cpamp-ingress:pah-s0-proof
    restart: 'no'
    network_mode: 'service:cpamp-runtime'
    # Publish only through Runtime, which owns the shared network namespace.
    # Do NOT publish 8317/9081/9082 or add ports to this service.
    environment:
      CPAMP_INGRESS_ADDR: '0.0.0.0:${CPAMP_PAH_S0_PUBLIC_PORT:-28491}'
      CPAMP_PRIVATE_PAH_S0: '1'
      CPAMP_MANAGER_URL: 'http://127.0.0.1:18319'
      CPAMP_GATEWAY_URL: 'http://127.0.0.1:8317'
      CPAMP_INGRESS_CONTROL_ADDR: '127.0.0.1:9082'
    depends_on:
      cpamp-runtime:
        condition: service_started
        restart: true
      cpamp-manager:
        condition: service_started

volumes:
  cpamp-pah-s0-manager-data:
  cpamp-pah-s0-runtime-data:
  cpamp-pah-s0-runtime-secret:
